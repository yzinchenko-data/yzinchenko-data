<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ярослав Зинченко — младший аналитик данных</title>
  <desc id="desc">Профиль аналитика данных: SQL, Python, продуктовая аналитика и статистика.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071B33"/>
      <stop offset=".55" stop-color="#11365A"/>
      <stop offset="1" stop-color="#0B5F63"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5DD6C0"/>
      <stop offset="1" stop-color="#66B8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="24" r="210" fill="#4CD8C1" opacity=".10"/>
  <circle cx="100" cy="370" r="230" fill="#4A9EE8" opacity=".11"/>

  <g opacity=".17" stroke="#8BC7EC">
    <path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
  </g>

  <g transform="translate(88 72)" filter="url(#shadow)">
    <rect width="12" height="216" rx="6" fill="url(#line)"/>
    <text x="42" y="54" fill="#A9C7DD" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3">ПРИВЕТ, Я</text>
    <text x="42" y="126" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="750">Ярослав Зинченко</text>
    <text x="42" y="178" fill="#65D7C0" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="650">Аналитик данных · Продуктовый аналитик</text>
    <text x="42" y="220" fill="#B3CDDF" font-family="Inter, Arial, sans-serif" font-size="22">SQL · Python · Статистика · BI · Продуктовые метрики</text>
  </g>

  <g transform="translate(970 126)">
    <rect x="0" y="0" width="126" height="102" rx="18" fill="#0A243F" stroke="#5DD6C0" stroke-opacity=".55"/>
    <path d="M26 68L48 45L66 58L96 28" fill="none" stroke="#5DD6C0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="26" cy="68" r="6" fill="#66B8FF"/>
    <circle cx="48" cy="45" r="6" fill="#66B8FF"/>
    <circle cx="66" cy="58" r="6" fill="#66B8FF"/>
    <circle cx="96" cy="28" r="6" fill="#66B8FF"/>
  </g>
</svg>
